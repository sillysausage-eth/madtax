  # ------------------------------------------------------------ expenditure --
  - id: bdns_grants
    name: BDNS — National Subsidies Database
    publisher: IGAE / Ministerio de Hacienda
    grade: A
    verified: 2026-08-29
    phase: 5
    priority: highest
    auth: none
    rate_limit: none published
    endpoints:
      calls: https://www.infosubvenciones.es/bdnstrans/api/convocatorias/busqueda
      awards: https://www.infosubvenciones.es/bdnstrans/api/concesiones/busqueda
    params: {page: 0, pageSize: 100, order: fechaConcesion, direccion: desc}
    coverage: {state_sector_from: 2014, all_administrations_from: 2016}
    volume: {awards: ~10500000, calls: ~350000}
    fields: [beneficiario_nif, beneficiario_nombre, importe, fechaConcesion, instrumento, nivel1, nivel2, nivel3, urlBR]
    notes: >
      The single highest-value source in the project. Named counterparties, euro-exact,
      every tier of government, clean JSON API. Build the "follow the money" experience
      on this before touching PLACSP.

  - id: placsp_tenders
    name: PLACSP — public sector procurement platform, open data
    publisher: Dirección General del Patrimonio del Estado
    grade: B
    verified: 2026-08-29
    phase: 5
    cadence: daily
    coverage: {from: 2012, to: 2026}
    format: zipped ATOM/XML
    url_patterns:
      annual: https://contrataciondelsectorpublico.gob.es/sindicacion/sindicacion_643/licitacionesPerfilesContratanteCompleto3_{year}.zip
      monthly: https://contrataciondelsectorpublico.gob.es/sindicacion/sindicacion_643/licitacionesPerfilesContratanteCompleto3_{year}{month:02d}.zip
    datasets: [tenders_contractor_profiles, tenders_aggregated_regional, minor_contracts, contractor_profiles]
    entry_file: licitacionesPerfilesContratanteCompleto3.atom
    caveats:
      - Max 500 entries per ATOM file; follow pagination within the archive.
      - A tender reappears on every modification — deduplicate by id, keep latest version.
      - >
        TLS chain is issued by FNMT-RCM, absent from several default trust stores.
        curl on macOS fails with exit 60 while OpenSSL verifies fine. Ship the FNMT root
        explicitly in the ingestion container. Do NOT disable certificate verification.

  - id: conprel_local
    name: CONPREL — local entity budgets and liquidations
    publisher: Secretaría General de Financiación Autonómica y Local
    grade: B
    verified: 2026-09-08
    phase: 1
    coverage: {from: 2002, to: 2024}
    endpoint: https://serviciostelematicosext.hacienda.gob.es/SGFAL/CONPREL
    formats: {aggregates: xlsx, per_entity: access_mdb_zipped}
    entity_types: [ayuntamiento, diputacion, cabildo, consejo_insular, area_metropolitana]
    lag_months: 12-24
    tooling: mdbtools
    notes: >
      Only route to ~8,100 municipalities. Access format is awkward but tractable. The
      per-community aggregate (DescargaFichero?CCAA=nn&TipoDato=Liquidaciones&
      Ejercicio=yyyy&TipoPublicacion=Definitiva, Tabla 2) feeds the municipal layer of
      the revenue map — IBI, other local own taxes, fees — for 2012-2024 since merge13.js
      (2019-2023 in the first build). Since merge17.js the same table's chapter 3 by
      article (30-36, 38, 39; 37 unused) is published per community as "what councils
      charge, by kind"; the articles reproduce the chapter total exactly in thousands.
      2025 definitive: not yet published (HTTP 500).
      CCAA codes 18/19 are Ceuta and Melilla and are skipped by name, not by code.
      TRAP: the Navarre files for 2013 and 2014 exist, resolve, and are zero on every
      line including the chapter totals; the Ministry's "Haciendas Locales en cifras"
      annexes leave Navarre blank for the same years. An all-zero table is absent, not
      zero — extract_local.py drops it and those two revenue years are not published.

