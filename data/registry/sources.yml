    notes: Postcode-level income data is rare internationally. High-value differentiator.

  - id: aeat_corporate_accounts
    name: AEAT — annual accounts statistics, corporate income tax
    publisher: AEAT
    grade: B
    verified: 2026-09-08
    phase: 2
    in_bundle: who.corp.years (consolidated edition, turnover brackets)
    coverage: {from: 2016, to: 2023}
    next_release: 2026-10
    index_consolidated: https://sede.agenciatributaria.gob.es/Sede/datosabiertos/catalogo/hacienda/Cuentas_Anuales_Consolidadas_del_Impuesto_sobre_Sociedades.shtml
    index_nonconsolidated: https://sede.agenciatributaria.gob.es/Sede/datosabiertos/catalogo/hacienda/Cuentas_Anuales_No_Consolidadas_del_Impuesto_sobre_Sociedades.shtml
    site_pattern: https://sede.agenciatributaria.gob.es/AEAT/Contenidos_Comunes/La_Agencia_Tributaria/Estadisticas/Publicaciones/sites/sociedadesdc/{year}/home.html
    dimensions: [turnover_bracket, cnae_sector, ccaa, company_class, group_vs_standalone, sign_of_result]
    turnover_brackets: 17
    large_company_threshold_eur: 6010121.04
    source_forms: [modelo_200, modelo_220]
    extractor: pipeline/spain/extract_corp_brackets.py
    notes: >
      Two editions. The NON-consolidated one (sociedadest2, 2002-) counts every modelo 200
      return, 14 turnover brackets. The CONSOLIDATED one (sociedadesdc, 2016-) counts a tax
      group (modelo 220) once and a standalone company once, 17 brackets from "0 - 50" to
      "> 1.000.000" thousand euros, and is what the Informe Anual's table 8.5 summarises —
      the bundle uses it so brackets and 8.5 tie out (tax and base agree to the rounding
      in every year; "Beneficio" differs from 8.5's revised 2016 and 2018 by 0.87% / 0.01%).
      The same table is published once per sector (5 CNAE groupings that partition the
      census) and once per group/standalone split; the bundle carries the sector cross,
      which is the finest published detail inside a turnover bracket. Cells marked "SE"
      are withheld under statistical secrecy (too few filers to publish without
      identifying them): two exist, both tax in 2020, carried as null.
      HTML tables only, no CSV/XLSX; page names are per-year hashes, so the extractor walks
      the menu by label. Columns changed in 2019 ("Empresas con Cuota Líquida Positiva"
      added; "Base imponible" renamed "Base imponible positiva"). Publishes NO ranking
      by profit (deciles are not derivable) and NO company names.

  - id: cnmv_xbrl
